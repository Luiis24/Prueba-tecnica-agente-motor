<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Pólizas</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <h1>Gestor de Renovación de Pólizas</h1>
    </header>
    
    <section class="filters">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Buscar cliente...">
        </div>
        <div class="filter-box">
            <select id="tipoPolizaFilter">
                <option value="">📋 Todos los tipos</option>
            </select>
        </div>
        <button id="btnAgregarCliente" class="btn-agregar">
            ➕ Agregar Cliente
        </button>
    </section>
    
    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Tipo</th>
                    <th>Vencimiento</th>
                    <th>Estado</th>
                    <th>Prioridad</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </section>
    
    <!-- Modal para cliente/póliza -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal">✖</span>
            <div id="modalBody"></div>
        </div>
    </div>
    
    <!-- Modal para agregar cliente -->
    <div id="modalCliente" class="modal hidden">
        <div class="modal-content">
            <span id="closeModalCliente">✖</span>
            <div id="modalClienteBody"></div>
        </div>
    </div>
    
    <div id="toastContainer"></div>
    
    <script src="./js/api.js"></script>
    <script src="./js/dashboard.js"></script>
</body>

</html>
